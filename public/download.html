<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>天才猫软件中心 — 官方软件生态与多平台应用下载</title>
    <meta name="description" content="天才猫官方软件中心。汇聚桌面效能、运营中枢、数据中心与生产力工具。支持 Windows、macOS 与绿色便携多平台，高速一键下载与版本更新记录。" />
    <link rel="icon" type="image/png" href="/logo.png?v=20261017" />
    <link rel="apple-touch-icon" href="/logo.png?v=20261017" />

    <!-- 语义化样式与图标库（无外部 CDN / 无 Tailwind 依赖） -->
    <link rel="stylesheet" href="/css/software-center.css?v=20261017-v4" />
    <script src="/vendor/lucide.min.js?v=20261017-v4" defer></script>
  </head>
  <body>
    <!-- 极光弥散渐变背景 -->
    <div class="sc-aurora-mesh" aria-hidden="true">
      <div class="sc-aurora-orb sc-aurora-orb--1"></div>
      <div class="sc-aurora-orb sc-aurora-orb--2"></div>
      <div class="sc-aurora-orb sc-aurora-orb--3"></div>
      <div class="sc-aurora-grid"></div>
    </div>

    <!-- 1. 顶部悬浮胶囊导航 -->
    <header class="sc-nav-wrap">
      <div class="sc-nav sc-glass">
        <!-- Logo -->
        <a href="/" class="sc-nav__brand">
          <div class="sc-nav__logo">
            <div class="sc-nav__logo-inner">
              <i data-lucide="layers" style="width: 16px; height: 16px;"></i>
            </div>
          </div>
          <div>
            <span class="sc-nav__title">NSY</span>
            <span class="sc-nav__subtitle">软件中心</span>
          </div>
        </a>

        <!-- 导航链接 -->
        <nav class="sc-nav__links">
          <a href="/" class="sc-nav__link">官网首页</a>
          <a href="/download.html" class="sc-nav__link sc-nav__link--active">
            <span class="sc-badge--dot sc-badge--dot-pulse" style="color: var(--sc-cyan);"></span>
            <span>软件中心</span>
          </a>
          <a href="/articles.html" class="sc-nav__link">使用教程</a>
          <a href="/desktop.html" class="sc-nav__link">
            <span>桌面 2.0</span>
            <i data-lucide="arrow-up-right" style="width: 14px; height: 14px;"></i>
          </a>
        </nav>

        <!-- 右侧操作 -->
        <div class="sc-nav__actions">
          <button type="button" class="sc-nav__search-btn" id="navSearchTrigger" title="聚焦搜索">
            <i data-lucide="search" style="width: 16px; height: 16px;"></i>
          </button>
          <a href="/desktop.html" class="sc-btn sc-btn--ghost sc-btn--sm sc-btn-shimmer">
            <i data-lucide="sparkles" style="width: 14px; height: 14px; color: var(--sc-cyan);"></i>
            <span>体验旗舰桌面</span>
          </a>
        </div>
      </div>
    </header>

    <!-- 主内容区 -->
    <main class="sc-main">
      <div class="sc-container">
        
        <!-- 2. 头部推广轮播 HERO -->
        <section class="sc-hero sc-glass" id="heroCarousel" aria-label="主推软件轮播">
          <div class="sc-hero__track" id="heroTrack">
            <!-- 骨架屏轮播初始占位 -->
            <div class="sc-hero__slide sc-hero__slide--active">
              <div class="sc-hero__info">
                <div class="sc-skeleton" style="width: 140px; height: 26px; border-radius: 9999px; margin-bottom: 16px;"></div>
                <div class="sc-skeleton" style="width: 320px; height: 48px; margin-bottom: 16px;"></div>
                <div class="sc-skeleton" style="width: 260px; height: 24px; margin-bottom: 16px;"></div>
                <div class="sc-skeleton" style="width: 480px; height: 40px; margin-bottom: 24px;"></div>
                <div style="display: flex; gap: 16px; margin-bottom: 24px;">
                  <div class="sc-skeleton" style="width: 160px; height: 50px; border-radius: 14px;"></div>
                  <div class="sc-skeleton" style="width: 140px; height: 50px; border-radius: 14px;"></div>
                </div>
              </div>
              <div class="sc-hero__visual">
                <div class="sc-skeleton" style="width: 380px; height: 260px; border-radius: 16px;"></div>
              </div>
            </div>
          </div>

          <!-- 轮播控制器 -->
          <div class="sc-hero__controls" id="heroControls" style="display: none;">
            <div class="sc-hero__dots" id="heroDots"></div>
            <div class="sc-hero__arrows">
              <button type="button" class="sc-hero__arrow" id="heroPrevBtn" aria-label="上一个">
                <i data-lucide="chevron-left" style="width: 16px; height: 16px;"></i>
              </button>
              <button type="button" class="sc-hero__arrow" id="heroNextBtn" aria-label="下一个">
                <i data-lucide="chevron-right" style="width: 16px; height: 16px;"></i>
              </button>
            </div>
          </div>
        </section>

        <!-- 3. 核心数据条 (一行 4 个小玻璃块) -->
        <section class="sc-stats-row" id="statsRow" aria-label="数据概览">
          <div class="sc-stat-card sc-glass">
            <div class="sc-stat-card__icon">
              <i data-lucide="boxes" style="width: 22px; height: 22px;"></i>
            </div>
            <div>
              <div class="sc-stat-card__val" id="statSoftwareCount">-</div>
              <div class="sc-stat-card__label">收录软件产品</div>
            </div>
          </div>

          <div class="sc-stat-card sc-glass">
            <div class="sc-stat-card__icon">
              <i data-lucide="download-cloud" style="width: 22px; height: 22px;"></i>
            </div>
            <div>
              <div class="sc-stat-card__val" id="statDownloadCount">-</div>
              <div class="sc-stat-card__label">累计安全下载</div>
            </div>
          </div>

          <div class="sc-stat-card sc-glass">
            <div class="sc-stat-card__icon">
              <i data-lucide="refresh-cw" style="width: 22px; height: 22px;"></i>
            </div>
            <div>
              <div class="sc-stat-card__val" id="statUpdateCount">-</div>
              <div class="sc-stat-card__label">本月版本更新</div>
            </div>
          </div>

          <div class="sc-stat-card sc-glass">
            <div class="sc-stat-card__icon">
              <i data-lucide="cpu" style="width: 22px; height: 22px;"></i>
            </div>
            <div>
              <div class="sc-stat-card__val" id="statPlatformCount">-</div>
              <div class="sc-stat-card__label">支持平台架构</div>
            </div>
          </div>
        </section>

        <!-- 4. 分类导航与筛选栏 (吸顶) -->
        <section class="sc-filter-sticky">
          <div class="sc-filter-bar sc-glass">
            <!-- 分类胶囊 (全部 + 各分类) -->
            <div class="sc-filter-bar__left" id="categoryChips">
              <button type="button" class="sc-chip sc-chip--active" data-cat="all">
                <span>全部软件</span>
                <span class="sc-chip__count" id="chipCountAll">0</span>
              </button>
            </div>

            <!-- 右侧平台分段与搜索 -->
            <div class="sc-filter-bar__right">
              <!-- 平台分段控件 -->
              <div class="sc-segment" id="platformSegment">
                <button type="button" class="sc-segment__btn sc-segment__btn--active" data-platform="all">全部</button>
                <button type="button" class="sc-segment__btn" data-platform="windows">Windows</button>
                <button type="button" class="sc-segment__btn" data-platform="macos">macOS</button>
                <button type="button" class="sc-segment__btn" data-platform="portable">绿色版</button>
                <button type="button" class="sc-segment__btn" data-platform="other">其他</button>
              </div>

              <!-- 搜索框 -->
              <div class="sc-search">
                <i data-lucide="search" class="sc-search__icon" style="width: 15px; height: 15px;"></i>
                <input type="text" class="sc-search__input" id="searchInput" placeholder="搜索软件或功能..." autocomplete="off" />
                <i data-lucide="x" class="sc-search__clear" id="searchClearBtn" style="width: 14px; height: 14px;"></i>
              </div>
            </div>
          </div>
        </section>

        <!-- 5. 新品上架 (横滑卡片行) -->
        <section class="sc-new-wrap" id="newArrivalsSection">
          <div class="sc-section-header">
            <div class="sc-section-title">
              <i data-lucide="sparkles" style="width: 18px; height: 18px; color: var(--sc-cyan);"></i>
              <span>新品首发上架</span>
              <span class="sc-badge sc-badge--cyan" style="font-size: 11px;">最新收录</span>
            </div>
            <div class="sc-section-header__actions">
              <button type="button" class="sc-slider-arrow" id="newTrackPrev" aria-label="向左滚动">
                <i data-lucide="chevron-left" style="width: 16px; height: 16px;"></i>
              </button>
              <button type="button" class="sc-slider-arrow" id="newTrackNext" aria-label="向右滚动">
                <i data-lucide="chevron-right" style="width: 16px; height: 16px;"></i>
              </button>
            </div>
          </div>

          <div class="sc-new-track-wrap">
            <div class="sc-new-track" id="newArrivalsTrack">
              <!-- 初始骨架卡片 -->
              <div class="sc-card--new sc-glass">
                <div class="sc-skeleton" style="width: 100%; height: 160px; border-radius: 12px;"></div>
              </div>
              <div class="sc-card--new sc-glass">
                <div class="sc-skeleton" style="width: 100%; height: 160px; border-radius: 12px;"></div>
              </div>
              <div class="sc-card--new sc-glass">
                <div class="sc-skeleton" style="width: 100%; height: 160px; border-radius: 12px;"></div>
              </div>
            </div>
          </div>
        </section>

        <!-- 6. 主体两栏布局 (左: 全部软件, 右: 排行榜与更新动态) -->
        <div class="sc-layout">
          <!-- 左侧全部软件列表 -->
          <section>
            <div class="sc-list-header">
              <div class="sc-section-title">
                <i data-lucide="layout-grid" style="width: 18px; height: 18px; color: var(--sc-cyan);"></i>
                <span>全部软件矩阵</span>
                <span class="sc-list-header__count" id="listResultCount">共 0 款应用</span>
              </div>
              <div>
                <select class="sc-select" id="sortSelect" aria-label="软件排序">
                  <option value="recommend">推荐优先</option>
                  <option value="updated">最近更新</option>
                  <option value="downloads">下载最多</option>
                  <option value="name">名称排序</option>
                </select>
              </div>
            </div>

            <!-- 卡片网格 -->
            <div class="sc-grid" id="softwareGrid">
              <!-- 初始骨架屏 (12 个卡片占位) -->
              <div class="sc-card sc-glass">
                <div class="sc-skeleton" style="aspect-ratio: 16/9; width: 100%;"></div>
                <div style="padding: 24px 18px 18px;">
                  <div class="sc-skeleton" style="width: 60%; height: 20px; margin-bottom: 12px;"></div>
                  <div class="sc-skeleton" style="width: 90%; height: 16px; margin-bottom: 8px;"></div>
                  <div class="sc-skeleton" style="width: 75%; height: 16px; margin-bottom: 16px;"></div>
                  <div class="sc-skeleton" style="width: 100%; height: 40px; border-radius: 12px;"></div>
                </div>
              </div>
              <div class="sc-card sc-glass">
                <div class="sc-skeleton" style="aspect-ratio: 16/9; width: 100%;"></div>
                <div style="padding: 24px 18px 18px;">
                  <div class="sc-skeleton" style="width: 60%; height: 20px; margin-bottom: 12px;"></div>
                  <div class="sc-skeleton" style="width: 90%; height: 16px; margin-bottom: 8px;"></div>
                  <div class="sc-skeleton" style="width: 75%; height: 16px; margin-bottom: 16px;"></div>
                  <div class="sc-skeleton" style="width: 100%; height: 40px; border-radius: 12px;"></div>
                </div>
              </div>
              <div class="sc-card sc-glass">
                <div class="sc-skeleton" style="aspect-ratio: 16/9; width: 100%;"></div>
                <div style="padding: 24px 18px 18px;">
                  <div class="sc-skeleton" style="width: 60%; height: 20px; margin-bottom: 12px;"></div>
                  <div class="sc-skeleton" style="width: 90%; height: 16px; margin-bottom: 8px;"></div>
                  <div class="sc-skeleton" style="width: 75%; height: 16px; margin-bottom: 16px;"></div>
                  <div class="sc-skeleton" style="width: 100%; height: 40px; border-radius: 12px;"></div>
                </div>
              </div>
            </div>

            <!-- 加载更多 -->
            <div class="sc-load-more-wrap" id="loadMoreWrap" style="display: none;">
              <button type="button" class="sc-btn sc-btn--ghost" id="loadMoreBtn">
                <i data-lucide="chevron-down" style="width: 16px; height: 16px;"></i>
                <span>加载更多应用</span>
              </button>
            </div>
          </section>

          <!-- 右侧边栏: 排行榜 + 最近更新 -->
          <aside class="sc-aside">
            <!-- 排行榜卡片 -->
            <div class="sc-rank sc-glass">
              <div class="sc-rank__tabs">
                <button type="button" class="sc-rank__tab sc-rank__tab--active" id="rankTabDownloads" data-tab="downloads">下载总榜</button>
                <button type="button" class="sc-rank__tab" id="rankTabUpdates" data-tab="updates">最近更新榜</button>
              </div>
              <div class="sc-rank__list" id="rankList">
                <div class="sc-skeleton" style="height: 48px; border-radius: 8px; margin-bottom: 8px;"></div>
                <div class="sc-skeleton" style="height: 48px; border-radius: 8px; margin-bottom: 8px;"></div>
                <div class="sc-skeleton" style="height: 48px; border-radius: 8px;"></div>
              </div>
            </div>

            <!-- 最近更新卡片 (5 条) -->
            <div class="sc-recent sc-glass">
              <div class="sc-recent__title">
                <i data-lucide="history" style="width: 16px; height: 16px; color: var(--sc-cyan);"></i>
                <span>最新发布动态</span>
              </div>
              <div class="sc-recent__list" id="recentList">
                <div class="sc-skeleton" style="height: 38px; border-radius: 6px; margin-bottom: 8px;"></div>
                <div class="sc-skeleton" style="height: 38px; border-radius: 6px; margin-bottom: 8px;"></div>
                <div class="sc-skeleton" style="height: 38px; border-radius: 6px;"></div>
              </div>
            </div>
          </aside>
        </div>

      </div>
    </main>

    <!-- 7. 页脚 -->
    <footer class="sc-footer">
      <div class="sc-container">
        <div class="sc-footer__content">
          <div style="display: flex; align-items: center; gap: 12px;">
            <span style="font-weight: 700; color: #ffffff; font-size: 15px;">NSY</span>
            <span>·</span>
            <span>Copyright © 2026 天才猫工作室. 保留所有权利.</span>
          </div>
          <div class="sc-footer__links">
            <a href="/" class="sc-footer__link">官网首页</a>
            <a href="/desktop.html" class="sc-footer__link">桌面 2.0 旗舰</a>
            <a href="/articles.html" class="sc-footer__link">使用教程与专栏</a>
            <a href="/license.html" class="sc-footer__link">正版授权购买</a>
          </div>
        </div>
      </div>
    </footer>

    <!-- Toast 提示 -->
    <div class="sc-toast sc-glass" id="scToast">
      <i data-lucide="check-circle" style="width: 16px; height: 16px; color: var(--sc-emerald);"></i>
      <span id="scToastMsg">操作成功</span>
    </div>

    <!-- 核心逻辑脚本 (纯净原生 JS) -->
    <script src="/software-center.js?v=20261017-v4" defer></script>
  </body>
</html>
