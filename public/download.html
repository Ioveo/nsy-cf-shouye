    <style>
      :root {
        --color-bg: #07090e;
        --color-cyan: #00f2fe;
        --color-violet: #7c3aed;
      }

      body {
        background-color: #07090e;
        color: #f8fafc;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      ::selection {
        background: rgba(0, 242, 254, 0.28);
        color: #ffffff;
      }

      /* Apple-grade Glassmorphic Panels */
      .glass-card {
        background: rgba(255, 255, 255, 0.035);
        backdrop-filter: blur(24px) saturate(180%);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-top: 1px solid rgba(255, 255, 255, 0.22);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      }

      .glass-card-hover {
        transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1),
                    border-color 0.35s cubic-bezier(0.16, 1, 0.3, 1),
                    box-shadow 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .glass-card-hover:hover {
        border-color: rgba(255, 255, 255, 0.25);
        border-top-color: rgba(0, 242, 254, 0.5);
        box-shadow: 0 30px 70px rgba(0, 0, 0, 0.65), 0 0 40px rgba(0, 242, 254, 0.08);
        transform: translateY(-2px);
      }

      /* Glowing Aurora Mesh Gradients */
      .aurora-mesh {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        overflow: hidden;
      }
      .aurora-orb {
        position: absolute;
        border-radius: 9999px;
        filter: blur(100px);
        opacity: 0.18;
        mix-blend-mode: screen;
        animation: auroraFloat 18s ease-in-out infinite alternate;
      }
      .aurora-orb-1 {
        top: -15%;
        left: 20%;
        width: 700px;
        height: 600px;
        background: radial-gradient(circle, #4f46e5 0%, #06b6d4 100%);
      }
      .aurora-orb-2 {
        top: 25%;
        right: -10%;
        width: 650px;
        height: 650px;
        background: radial-gradient(circle, #7c3aed 0%, #00f2fe 100%);
        animation-duration: 22s;
        animation-delay: -5s;
      }
      .aurora-orb-3 {
        bottom: 5%;
        left: -5%;
        width: 600px;
        height: 500px;
        background: radial-gradient(circle, #06b6d4 0%, #4338ca 100%);
        animation-duration: 26s;
        animation-delay: -10s;
      }

      @keyframes auroraFloat {
        0% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(40px, 30px) scale(1.08); }
        100% { transform: translate(-30px, 50px) scale(0.96); }
      }

      /* Button Shimmer Effect */
      .btn-shimmer {
        position: relative;
        overflow: hidden;
      }
      .btn-shimmer::after {
        content: '';
        position: absolute;
        top: -50%;
        left: -150%;
        width: 80%;
        height: 200%;
        background: linear-gradient(
          60deg,
          transparent,
          rgba(255, 255, 255, 0.35),
          transparent
        );
        transform: rotate(30deg);
        animation: shimmerSweep 4.5s ease-in-out infinite;
      }
      @keyframes shimmerSweep {
        0% { left: -150%; }
        25% { left: 180%; }
        100% { left: 180%; }
      }

      /* Staggered Entrance Animations */
      .stagger-in {
        opacity: 0;
        transform: translateY(20px);
        animation: staggerFadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes staggerFadeIn {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .stagger-1 { animation-delay: 0.1s; }
      .stagger-2 { animation-delay: 0.2s; }
      .stagger-3 { animation-delay: 0.3s; }
      .stagger-4 { animation-delay: 0.4s; }
    </style>
  </head>
