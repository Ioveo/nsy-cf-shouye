      /* Apple-grade Glassmorphic Panels */
      .glass-card {
        background: rgba(255, 255, 255, 0.035);
        backdrop-filter: blur(24px) saturate(180%);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-top: 1px solid rgba(255, 255, 255, 0.22);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      }

      /* Glowing Aurora Mesh Gradients */
      .aurora-mesh {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        overflow: hidden;
      }
      .aurora-orb {
        position: absolute;
        border-radius: 9999px;
        filter: blur(100px);
        opacity: 0.18;
        mix-blend-mode: screen;
      }
      .aurora-orb-1 {
        top: -10%;
        left: 20%;
        width: 700px;
        height: 600px;
        background: radial-gradient(circle, #4f46e5 0%, #06b6d4 100%);
      }
      .aurora-orb-2 {
        top: 30%;
        right: -10%;
        width: 650px;
        height: 650px;
        background: radial-gradient(circle, #7c3aed 0%, #00f2fe 100%);
      }

      /* Button Shimmer Effect */
      .btn-shimmer {
        position: relative;
        overflow: hidden;
      }
      .btn-shimmer::after {
        content: '';
        position: absolute;
        top: -50%;
        left: -150%;
        width: 80%;
        height: 200%;
        background: linear-gradient(
          60deg,
          transparent,
          rgba(255, 255, 255, 0.35),
          transparent
        );
        transform: rotate(30deg);
        animation: shimmerSweep 4.5s ease-in-out infinite;
      }
      @keyframes shimmerSweep {
        0% { left: -150%; }
        25% { left: 180%; }
        100% { left: 180%; }
      }

      /* Markdown Content Styling */
      .prose-dark {
        color: #cbd5e1;
        font-size: 0.9375rem;
        line-height: 1.75;
      }
      .prose-dark p { margin-bottom: 1.25rem; }
      .prose-dark h2 {

        margin-top: 2rem;
        margin-bottom: 1rem;
        padding-bottom: 0.5rem;

      }
      .prose-dark h3 {
        color: #f1f5f9;
        font-size: 1.15rem;
        font-weight: 600;
        margin-top: 1.5rem;
        margin-bottom: 0.75rem;
      }
      .prose-dark ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1.25rem; }
      .prose-dark ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 1.25rem; }
      .prose-dark li { margin-bottom: 0.5rem; }
      .prose-dark blockquote {
        border-left: 3px solid #00f2fe;
        padding-left: 1rem;
        color: #94a3b8;
        font-style: italic;
        margin: 1.25rem 0;
      }
      .prose-dark pre {
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 0.75rem;
        padding: 1rem;
        overflow-x: auto;
        margin: 1.25rem 0;
      }
      .prose-dark code {
        font-family: monospace;
        font-size: 0.875rem;
        color: #00f2fe;
      }
      .prose-dark a {
        color: #00f2fe;
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      /* Horizontal Scrollable Gallery */
      .gallery-rail {
        display: flex;
        gap: 1rem;
        overflow-x: auto;
        padding-bottom: 0.75rem;
        scroll-snap-type: x mandatory;
      }
      .gallery-rail::-webkit-scrollbar {

      }
      .gallery-rail::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.15);
        border-radius: 9999px;
      }

      /* Lightbox Modal */
      #lightboxModal {
        transition: opacity 0.25s ease;
      }
      #lightboxModal.hidden {
        display: none;
      }
