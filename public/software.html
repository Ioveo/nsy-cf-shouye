<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>软件详情 — 天才猫软件中心</title>
    <meta name="description" content="查看官方正版软件介绍、特性亮点、多平台安装包高速下载与版本历史更新记录。" />
    <link rel="icon" type="image/png" href="/logo.png?v=20261017" />
    <link rel="apple-touch-icon" href="/logo.png?v=20261017" />

    <!-- 语义化样式与图标库（无外部 CDN / 无 Tailwind 依赖） -->
    <link rel="stylesheet" href="/css/software-center.css?v=20261017-v4" />
    <script src="/vendor/lucide.min.js?v=20261017-v4" defer></script>
  </head>
  <body>
    <!-- 极光弥散渐变背景 -->
    <div class="sc-aurora-mesh" aria-hidden="true">
      <div class="sc-aurora-orb sc-aurora-orb--1"></div>
      <div class="sc-aurora-orb sc-aurora-orb--2"></div>
      <div class="sc-aurora-orb sc-aurora-orb--3"></div>
      <div class="sc-aurora-grid"></div>
    </div>

    <!-- 1. 顶部悬浮胶囊导航 -->
    <header class="sc-nav-wrap">
      <div class="sc-nav sc-glass">
        <!-- Logo -->
        <a href="/" class="sc-nav__brand">
          <div class="sc-nav__logo">
            <div class="sc-nav__logo-inner">
              <i data-lucide="layers" style="width: 16px; height: 16px;"></i>
            </div>
          </div>
          <div>
            <span class="sc-nav__title">NSY</span>
            <span class="sc-nav__subtitle">软件中心</span>
          </div>
        </a>

        <!-- 导航链接 -->
        <nav class="sc-nav__links">
          <a href="/" class="sc-nav__link">官网首页</a>
          <a href="/download.html" class="sc-nav__link sc-nav__link--active">软件列表</a>
          <a href="/articles.html" class="sc-nav__link">使用教程</a>
          <a href="/desktop.html" class="sc-nav__link">
            <span>桌面 2.0</span>
            <i data-lucide="arrow-up-right" style="width: 14px; height: 14px;"></i>
          </a>
        </nav>

        <!-- 右侧返回 -->
        <div class="sc-nav__actions">
          <a href="/download.html" class="sc-btn sc-btn--ghost sc-btn--sm">
            <i data-lucide="arrow-left" style="width: 14px; height: 14px;"></i>
            <span>返回软件中心</span>
          </a>
        </div>
      </div>
    </header>

    <!-- 主内容区 -->
    <main class="sc-main">
      <div class="sc-container">
        
        <!-- 骨架屏加载状态 -->
        <div id="detailSkeleton">
          <div class="sc-detail-hero sc-glass">
            <div style="display: flex; gap: 24px; align-items: center; margin-bottom: 24px;">
              <div class="sc-skeleton" style="width: 96px; height: 96px; border-radius: 20px;"></div>
              <div style="flex: 1;">
                <div class="sc-skeleton" style="width: 240px; height: 36px; margin-bottom: 12px;"></div>
                <div class="sc-skeleton" style="width: 380px; height: 20px; margin-bottom: 12px;"></div>
                <div class="sc-skeleton" style="width: 180px; height: 24px; border-radius: 9999px;"></div>
              </div>
            </div>
            <div style="display: flex; gap: 16px;">
              <div class="sc-skeleton" style="width: 200px; height: 50px; border-radius: 14px;"></div>
              <div class="sc-skeleton" style="width: 160px; height: 50px; border-radius: 14px;"></div>
            </div>
          </div>
        </div>

        <!-- 详情核心渲染区域 -->
        <div id="detailContent" style="display: none;">
          
          <!-- 1. 顶部大卡 -->
          <section class="sc-detail-hero sc-glass" id="heroCard">
            <div class="sc-detail-hero__top">
              <img id="appIcon" src="/logo.png" alt="应用图标" class="sc-detail-hero__icon" />
              <div class="sc-detail-hero__info">
                <div class="sc-detail-hero__title-row">
                  <h1 class="sc-detail-hero__title" id="appName">-</h1>
                  <span class="sc-badge sc-badge--cyan" id="appCategoryBadge">应用工具</span>
                  <span class="sc-badge sc-badge--emerald" id="appPriceBadge">官方免费</span>
                  <a href="#" target="_blank" rel="noopener" class="sc-badge sc-badge--cyan" id="landingLinkBadge" style="display: none;">
                    <span>查看产品介绍页</span>
                    <i data-lucide="external-link" style="width: 12px; height: 12px;"></i>
                  </a>
                </div>
                <div class="sc-detail-hero__tagline" id="appTagline">-</div>
                <div class="sc-detail-hero__badges" id="appPlatformsBadges"></div>
              </div>
            </div>

            <!-- 主下载与版本选择按钮组 -->
            <div class="sc-detail-hero__actions">
              <a href="#" class="sc-btn sc-btn--primary sc-btn-shimmer" id="primaryDownloadBtn">
                <i data-lucide="download" style="width: 18px; height: 18px;"></i>
                <span id="primaryDownloadLabel">立即下载最新版</span>
              </a>

              <!-- 其它版本下拉菜单容器 -->
              <div style="position: relative;" id="otherPackagesWrap">
                <button type="button" class="sc-btn sc-btn--ghost" id="otherPackagesBtn">
                  <span>其它平台版本</span>
                  <i data-lucide="chevron-down" style="width: 16px; height: 16px;"></i>
                </button>
                <div class="sc-glass" id="otherPackagesDropdown" style="display: none; position: absolute; top: calc(100% + 8px); left: 0; min-width: 220px; z-index: 40; padding: 8px; border-radius: 12px; box-shadow: 0 16px 40px rgba(0,0,0,0.7);">
                  <!-- 动态插入各平台安装包链接 -->
                </div>
              </div>
            </div>

            <!-- 元信息排 -->
            <div class="sc-detail-hero__meta-strip">
              <span class="sc-detail-hero__meta-item">
                <i data-lucide="tag" style="width: 14px; height: 14px; color: var(--sc-cyan);"></i>
                <span id="metaVersion">v1.0.0</span>
              </span>
              <span>·</span>
              <span class="sc-detail-hero__meta-item">
                <i data-lucide="hard-drive" style="width: 14px; height: 14px;"></i>
                <span id="metaSize">大小未知</span>
              </span>
              <span>·</span>
              <span class="sc-detail-hero__meta-item">
                <i data-lucide="calendar" style="width: 14px; height: 14px;"></i>
                <span id="metaDate">-</span>
              </span>
              <span>·</span>
              <span class="sc-detail-hero__meta-item">
                <i data-lucide="user" style="width: 14px; height: 14px;"></i>
                <span id="metaDeveloper">天才猫工作室</span>
              </span>
              <span>·</span>
              <span class="sc-detail-hero__meta-item">
                <i data-lucide="download" style="width: 14px; height: 14px;"></i>
                <span id="metaDownloads">0 次下载</span>
              </span>
              <span id="metaChecksumDivider" style="display: none;">·</span>
              <button type="button" class="sc-detail-hero__meta-item" id="metaChecksumBtn" style="cursor: pointer; display: none;" title="点击复制 SHA256 校验码">
                <i data-lucide="shield-check" style="width: 14px; height: 14px; color: var(--sc-emerald);"></i>
                <span id="metaChecksumText">SHA256</span>
                <i data-lucide="copy" style="width: 12px; height: 12px; margin-left: 2px;"></i>
              </button>
            </div>
          </section>

          <!-- 2. 截图画廊 -->
          <section class="sc-gallery-wrap" id="gallerySection" style="display: none;">
            <div class="sc-section-header">
              <div class="sc-section-title">
                <i data-lucide="image" style="width: 18px; height: 18px; color: var(--sc-cyan);"></i>
                <span>界面截图预览</span>
              </div>
            </div>
            <div class="sc-gallery-track" id="galleryTrack"></div>
          </section>

          <!-- 3. 详细介绍 (Markdown 安全渲染) -->
          <section class="sc-prose sc-glass" id="descSection" style="display: none;">
            <div id="descContent"></div>
          </section>

          <!-- 4. 特性亮点 (2-3 列玻璃卡) -->
          <section id="featuresSection" style="display: none; margin-bottom: 48px;">
            <div class="sc-section-header">
              <div class="sc-section-title">
                <i data-lucide="zap" style="width: 18px; height: 18px; color: var(--sc-cyan);"></i>
                <span>核心特性亮点</span>
              </div>
            </div>
            <div class="sc-features-grid" id="featuresGrid"></div>
          </section>

          <!-- 5. 多平台下载卡片矩阵 -->
          <section id="packagesSection" style="margin-bottom: 48px;">
            <div class="sc-section-header">
              <div class="sc-section-title">
                <i data-lucide="package" style="width: 18px; height: 18px; color: var(--sc-cyan);"></i>
                <span>安装包版本矩阵</span>
              </div>
            </div>
            <div class="sc-packages-grid" id="packagesGrid"></div>
          </section>

          <!-- 6. 版本更新历史折叠面板 -->
          <section id="historySection" style="display: none; margin-bottom: 48px;">
            <div class="sc-section-header">
              <div class="sc-section-title">
                <i data-lucide="history" style="width: 18px; height: 18px; color: var(--sc-cyan);"></i>
                <span>历史版本与更新说明</span>
              </div>
            </div>
            <div class="sc-accordion" id="historyAccordion"></div>
          </section>

          <!-- 7. 相关文章 / 教程 -->
          <section id="articlesSection" style="display: none; margin-bottom: 48px;">
            <div class="sc-section-header">
              <div class="sc-section-title">
                <i data-lucide="book-open" style="width: 18px; height: 18px; color: var(--sc-cyan);"></i>
                <span>相关使用教程</span>
              </div>
            </div>
            <div class="sc-grid" id="articlesGrid"></div>
          </section>

          <!-- 8. 同分类推荐软件 (4 个卡片) -->
          <section id="recommendSection" style="display: none; margin-bottom: 48px;">
            <div class="sc-section-header">
              <div class="sc-section-title">
                <i data-lucide="sparkles" style="width: 18px; height: 18px; color: var(--sc-cyan);"></i>
                <span>同分类热门推荐</span>
              </div>
            </div>
            <div class="sc-grid" id="recommendGrid"></div>
          </section>

        </div>

      </div>
    </main>

    <!-- 截图灯箱模态框 -->
    <div class="sc-lightbox" id="lightboxModal">
      <button type="button" class="sc-lightbox__close" id="lightboxClose" aria-label="关闭灯箱">
        <i data-lucide="x" style="width: 20px; height: 20px;"></i>
      </button>
      <button type="button" class="sc-lightbox__prev" id="lightboxPrev" aria-label="上一张">
        <i data-lucide="chevron-left" style="width: 24px; height: 24px;"></i>
      </button>
      <img src="" alt="大图预览" class="sc-lightbox__img" id="lightboxImg" />
      <button type="button" class="sc-lightbox__next" id="lightboxNext" aria-label="下一张">
        <i data-lucide="chevron-right" style="width: 24px; height: 24px;"></i>
      </button>
    </div>

    <!-- 页脚 -->
    <footer class="sc-footer">
      <div class="sc-container">
        <div class="sc-footer__content">
          <div style="display: flex; align-items: center; gap: 12px;">
            <span style="font-weight: 700; color: #ffffff; font-size: 15px;">NSY</span>
            <span>·</span>
            <span>Copyright © 2026 天才猫工作室. 保留所有权利.</span>
          </div>
          <div class="sc-footer__links">
            <a href="/" class="sc-footer__link">官网首页</a>
            <a href="/download.html" class="sc-footer__link">软件中心</a>
            <a href="/desktop.html" class="sc-footer__link">桌面 2.0 旗舰</a>
            <a href="/articles.html" class="sc-footer__link">使用教程</a>
          </div>
        </div>
      </div>
    </footer>

    <!-- Toast 提示 -->
    <div class="sc-toast sc-glass" id="scToast">
      <i data-lucide="check-circle" style="width: 16px; height: 16px; color: var(--sc-emerald);"></i>
      <span id="scToastMsg">校验码已复制到剪贴板</span>
    </div>

    <!-- 详情页核心脚本 -->
    <script src="/software.js?v=20261017-v4" defer></script>
  </body>
</html>
