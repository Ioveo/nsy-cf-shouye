  <body class="article-page">
    <div id="prog"></div>

    <nav class="detail-nav" id="detailNav">

        <a class="detail-nav__brand" href="/articles.html">
          <img src="/logo.png?v=20260509" alt="天才猫" class="detail-nav__logo-img" />

    <div class="article-tools" aria-label="阅读工具">
      <button type="button" id="mobileTocBtn" class="mobile-toc-btn" title="查看文章目录" aria-label="查看文章目录">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>

    <!-- 移动端目录抽屉 -->
    <div class="mobile-toc-drawer" id="mobileTocDrawer" hidden>
      <div class="mobile-toc-backdrop" id="mobileTocBackdrop"></div>
      <div class="mobile-toc-sheet">
        <div class="mobile-toc-sheet__header">
          <div class="mobile-toc-sheet__title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>

          </div>
          <button type="button" class="mobile-toc-sheet__close" id="closeMobileToc" aria-label="关闭目录">✕</button>
        </div>
        <nav class="mobile-toc-sheet__list" id="mobileTocList"></nav>
      </div>
    </div>

    <!-- 悬浮通知 Toast -->
    <div class="detail-toast" id="detailToast" role="status" aria-live="polite"></div>

    <div class="image-lightbox" id="imageLightbox" hidden>
      <button type="button" id="closeImageLightbox" aria-label="关闭图片预览">✕</button>
      <img id="imageLightboxImg" alt="图片预览" />
